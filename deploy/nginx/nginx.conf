worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
        '"status":$status,"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;
    keepalive_timeout 30s;
    keepalive_requests 100;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    reset_timedout_connection on;

    gzip on;
    gzip_static on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    limit_req_zone $binary_remote_addr zone=api_rate:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=client_conn:1m;

    upstream backend_upstream {
        server backend:8080;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
